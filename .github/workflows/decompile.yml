name: Decompile

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/decompile.yml
      - '**.exe'
      - '**.mfa'

jobs:
  decompile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Nebula
        shell: pwsh
        run: |
          dotnet tool install --global Nebula.Cli || dotnet tool update --global Nebula.Cli
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run decompile (Windows)
        shell: pwsh
        env:
          DOTNET_SYSTEM_DRAWING_ENABLE_NON_WINDOWS_FONTS: "false"
        run: |
          New-Item -ItemType Directory -Force -Path Dumps | Out-Null
          Get-ChildItem -Recurse -Filter *.exe | Select-Object FullName
          # Try common Nebula invocations
          nebula --help || Nebula --help || true
          # Decompile all exes in repo root - adjust if your exe is named fnaf4.exe
          $exe = Get-ChildItem -Filter *.exe | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem -Recurse -Filter *.exe | Select-Object -First 1 }
          if ($exe) {
            Write-Host "Decompiling $($exe.FullName)"
            nebula decompile "$($exe.FullName)" --output Dumps --mfa --extract-all 2>&1 | Tee-Object -FilePath decompile.log
          } else {
            Write-Host "No exe found, trying current directory"
            nebula decompile . --output Dumps --mfa --extract-all 2>&1 | Tee-Object -FilePath decompile.log
          }
          Get-ChildItem Dumps -Recurse -ErrorAction SilentlyContinue
          Get-Content decompile.log -ErrorAction SilentlyContinue | Select-Object -Last 100

      - name: Upload decompiled artifact
        uses: actions/upload-artifact@v4
        with:
          name: decompiled
          path: |
            Dumps/
            decompile.log
          if-no-files-found: warn
