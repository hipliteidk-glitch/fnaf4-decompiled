name: decompile-legal-test
on:
 push:
  branches: [main]
 workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Install deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libwebp-dev zlib1g-dev
      - name: Clone and build NebulaFD
        run: |
          set -e
          rm -rf NebulaFD nebulacli
          git clone https://github.com/AITYunivers/NebulaFD.git --depth 1 --branch 2024-nebula
          cd NebulaFD
          python3 <<'PYIN'
          import re, pathlib
          for proj in ["Nebula.CLI/Nebula.CLI.csproj", "Nebula.Core/Nebula.Core.csproj"]:
            p=pathlib.Path(proj)
            if not p.exists(): continue
            t=p.read_text()
            t=re.sub(r'<TargetFramework>.*?</TargetFramework>', '<TargetFramework>net6.0</TargetFramework>', t, flags=re.DOTALL)
            t=re.sub(r'<Target\b[^>]*>.*?</Target>', '', t, flags=re.DOTALL|re.IGNORECASE)
            p.write_text(t)
          PYIN
          dotnet publish Nebula.CLI/Nebula.CLI.csproj -c Release -o ../nebulacli -r linux-x64 --self-contained false
      - name: Verify + legal sample
        run: |
          ls -lh nebulacli
          rm -rf legal-sample
          git clone https://github.com/yancharkin/SpelunkyClassicHD.git legal-sample --depth 1
          ls legal-sample | head -n 50
      - name: Decompile own game
        run: |
          set -e
          mkdir -p decompiled
          export LD_LIBRARY_PATH=$(pwd)/nebulacli:$LD_LIBRARY_PATH
          if [ -f mygame/data.win ]; then
            echo Decompiling mygame/data.win
            nebulacli/Nebula mygame/data.win -o $(pwd)/decompiled -v || dotnet nebulacli/Nebula.dll mygame/data.win -o $(pwd)/decompiled -v || true
          else
            echo No mygame/data.win - legal example is SpelunkyClassicHD
            echo Build OK > decompiled/README.txt
          fi
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decompiled
          path: decompiled
          if-no-files-found: warn
