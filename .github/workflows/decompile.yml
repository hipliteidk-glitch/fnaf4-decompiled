name: Decompile

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/decompile.yml
      - '**.exe'
      - '**.mfa'

jobs:
  decompile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 6 + 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Clone and build NebulaFD
        shell: pwsh
        run: |
          git clone https://github.com/AITYunivers/NebulaFD.git NebulaFD --depth 1
          dotnet restore NebulaFD/Nebula.sln
          dotnet build NebulaFD/Nebula.sln -c Release --no-restore -v minimal
          Get-ChildItem NebulaFD -Recurse -Filter Nebula*.exe | Select-Object FullName

      - name: Run decompile (Windows)
        shell: pwsh
        run: |
          $nebula = Get-ChildItem NebulaFD -Recurse -Filter Nebula.exe | Where-Object { $_.FullName -like "*bin*Release*" } | Select-Object -First 1
          if (-not $nebula) { $nebula = Get-ChildItem NebulaFD -Recurse -Filter Nebula.exe | Select-Object -First 1 }
          if (-not $nebula) { throw "Nebula.exe not found after build" }
          Write-Host "Using $($nebula.FullName)"
          New-Item -ItemType Directory -Force -Path Dumps | Out-Null
          $exe = Get-ChildItem -Filter *.exe -Recurse | Where-Object { $_.Name -notlike "Nebula*" } | Select-Object -First 1
          if (-not $exe) { throw "No target exe found in repo" }
          Write-Host "Decompiling $($exe.FullName)"
          & $nebula.FullName decompile "$($exe.FullName)" -o Dumps --mfa --extract-all 2>&1 | Tee-Object -FilePath decompile.log
          # Fallback cli syntax
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Retrying with alternate args..."
            & $nebula.FullName "$($exe.FullName)" Dumps --decompile --mfa 2>&1 | Tee-Object -FilePath decompile.log -Append
          }
          Get-ChildItem Dumps -Recurse | Select-Object -First 100
          Get-Content decompile.log | Select-Object -Last 200

      - name: Upload decompiled artifact
        uses: actions/upload-artifact@v4
        with:
          name: decompiled
          path: |
            Dumps/
            decompile.log
          if-no-files-found: warn
