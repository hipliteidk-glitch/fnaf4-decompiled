name: decompile
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebp-dev zlib1g-dev unzip wget gh
          pip install Cython pillow
      - name: download exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release download fnaf4-input --repo ${{ github.repository }} --clobber || echo "no release fnaf4-input - searching any exe"
          ls -lh
          find . -maxdepth 2 -name "*.exe" -ls || true
      - name: download Nebula
        run: |
          set -e
          mkdir -p tools
          cd tools
          wget -q https://github.com/AITYunivers/NebulaFD/releases/download/general_patches/Nebula.general_patches.zip -O n.zip
          unzip -o n.zip
          cp runtimes/linux-x64/native/libz.so ./libz.so 2>/dev/null || cp /usr/lib/x86_64-linux-gnu/libz.so.1 ./libz.so || true
          cp ./libz.so ./zlibwapi.dll || true
          cp ./libz.so ./libzlibwapi.so || true
          cp ./libz.so ./libz.so.1 || true
          ls -lh *.dll *.so | head -n 20
      - name: decompile
        run: |
          set -e
          EXE="./fnaf4.exe"
          if [ ! -f "$EXE" ]; then EXE=$(find . -maxdepth 3 -type f -name "*.exe" | head -n1); fi
          if [ -z "$EXE" ] || [ ! -f "$EXE" ]; then echo "NO EXE FOUND!"; ls -R | head -n 200; exit 1; fi
          echo "EXE: $EXE -> $(realpath $EXE)"
          ls -lh "$EXE"
          DLL="tools/Nebula.dll"
          echo "DLL: $DLL"
          ls -lh tools/ | head -n 20
          export TERM=xterm-256color
          # Nebula is interactive: WaitForFile() prompts for File Path
          # In CI it returns null and throws NullReferenceException line 53
          # Fix: feed path via stdin
          echo "=== Running Nebula with piped input ==="
          set +e
          printf "%s\n" "$(realpath $EXE)" | dotnet "$DLL" 2>&1 | tee nebula.log
          CODE=$?
          echo "Exit code: $CODE"
          cat nebula.log | tail -n 300
          echo "=== Checking for output ==="
          find . -type d \( -name "Dumps" -o -name "dumps" -o -name "decompiled" \) 2>/dev/null
          find . -maxdepth 6 -type f -name "*.mfa" 2>/dev/null | head -n 20
          ls -R | head -n 1000
          # Try alternative with LD_LIBRARY_PATH
          if [ ! -d "./Dumps" ] && [ ! -d "./dumps" ]; then
            echo "=== Retry with LD_LIBRARY_PATH ==="
            LD_LIBRARY_PATH="$PWD/tools:$LD_LIBRARY_PATH" printf "%s\n" "$(realpath $EXE)" | dotnet "$DLL" 2>&1 | tee nebula2.log || true
            cat nebula2.log | tail -n 300
            ls -R | head -n 1000
          fi
          set -e
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decompiled
          path: |
            Dumps
            dumps
            decompiled
            *.mfa
            *.log
            nebula*.log
