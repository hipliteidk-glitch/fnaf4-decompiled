name: decompile
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Install deps
      run: |
        sudo apt-get update -y
        sudo apt-get install -y libwebp-dev zlib1g-dev unzip wget gh
    - name: Download FNAF4 exe
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e
        rm -f fnaf4.exe
        gh release download fnaf4-input --repo ${{ github.repository }} --clobber || (echo "no release" && gh release list --repo ${{ github.repository }} || true)
        ls -lh *.exe || exit 1
    - name: Clone and build NebulaFD CLI
      run: |
        set -e
        rm -rf NebulaFD
        git clone https://github.com/AITYunivers/NebulaFD.git --depth 1
        cd NebulaFD
        # Patch out Windows-only copy command
        sed -i '/<Target.*PostBuild/,/<\/Target>/d' Nebula.CLI/Nebula.CLI.csproj || true
        cat Nebula.CLI/Nebula.CLI.csproj | grep -n copy || echo 'copy removed'
        dotnet publish Nebula.CLI/Nebula.CLI.csproj -c Release -o ../nebulacli -r linux-x64 --self-contained false
        ls -lh ../nebulacli
        find ../nebulacli -name "*.dll" | head -n20
    - name: Decompile
      run: |
        set -e
        DLL=$(find nebulacli -name "Nebula.CLI.dll" | head -n1)
        echo "DLL=$DLL"
        ls -lh "$DLL"
        mkdir -p decompiled
        rm -rf decompiled/*
        dotnet "$DLL" "$(pwd)/fnaf4.exe" -o "$(pwd)/decompiled" -v
        ls -R decompiled | head -n 1000
    - name: Upload artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: decompiled
        path: decompiled
        if-no-files-found: warn
