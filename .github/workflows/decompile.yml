name: Decompile FNAF4 to Chowdren APK (cloud)

on:
  workflow_dispatch:

jobs:
  decompile-and-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup dotnet 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev libwebp-dev zlib1g-dev
          pip install Cython pillow
      - name: Download NebulaFD general_patches
        run: |
          mkdir -p tools/nebula
          cd tools/nebula
          wget -q https://github.com/AITYunivers/NebulaFD/releases/download/general_patches/Nebula.general_patches.zip -O nebula.zip
          unzip -o nebula.zip
          ls -la
          echo "---"
          echo "DLL files found:"
          find . -name "*.dll" -o -name "*.exe" | head -20
      - name: Find Nebula.CLI or fallback DLL
        run: |
          echo "Searching for Nebula.CLI.dll first..."
          DLL=$(find tools/nebula -name "Nebula.CLI.dll" | head -n1)
          if [ -n "$DLL" ]; then
            echo "Found Nebula.CLI.dll: $DLL"
            echo "Nebula_CLI_DLL=$DLL" >> $GITHUB_ENV
          else
            echo "Nebula.CLI.dll not found - searching for any Nebula.dll..."
            DLL=$(find tools/nebula -name "Nebula.dll" | head -n1)
            if [ -n "$DLL" ]; then
              echo "Found fallback Nebula.dll: $DLL"
              echo "Nebula_CLI_DLL=$DLL" >> $GITHUB_ENV
            else
              echo "⚠️ No Nebula.dll found at all!"
              echo "Nebula_CLI_DLL=" >> $GITHUB_ENV
            fi
          fi
          echo "Using DLL: $Nebula_CLI_DLL"
      - name: Download fnaf4.exe from release if exists
        run: |
          echo "Checking for fnaf4.exe..."
          if [ -f ./fnaf4.exe ]; then
            echo "fnaf4.exe already present in repo"
          else
            echo "fnaf4.exe not in repo - downloading from GitHub Release..."
            curl -L -o fnaf4.exe \
              https://github.com/hipliteidk-glitch/fnaf4-decompiled/releases/download/fnaf4-input/fnaf4.exe \
              || { echo "⚠️ Could not download fnaf4.exe - will skip decompile"; exit 0; }
          fi
          echo "fnaf4.exe check complete"
      - name: Try decompile if exe exists
        run: |
          echo "=== DECOMPILE START ==="
          echo "fnaf4.exe exists: $([ -f ./fnaf4.exe ] && echo 'YES' || echo 'NO')"
          echo "Using DLL: $Nebula_CLI_DLL"
          
          if [ -f ./fnaf4.exe ] && [ -n "$Nebula_CLI_DLL" ]; then
            echo "Decompiling FNAF4.exe..."
            mkdir -p decompiled
            dotnet "$Nebula_CLI_DLL"/./fnaf4.exe -o ./decompiled -v
            echo "Decompile exit code: $?"
          else
            if [ ! -f ./fnaf4.exe ]; then
              echo "⚠️ No fnaf4.exe found - creating placeholder"
              echo "No FNAF4 executable found. Add fnaf4.exe to GitHub Release 'fnaf4-input' or provide locally." > decompiled/README.txt
            fi
            if [ -z "$Nebula_CLI_DLL" ]; then
              echo "⚠️ Nebula.CLI/DLL not found - creating placeholder"
              echo "NebulaFD not properly set up. Download may have failed." > decompiled/README.txt
            fi
          fi
          echo "=== DECOMPILE END ==="
          ls -R decompiled || echo "decompiled directory empty or missing"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fnaf4-decompiled
          path: decompiled/
          if-no-files-found: warn