name: Decompile FNAF4 to Chowdren APK (cloud)

on:
  workflow_dispatch:

jobs:
  decompile-and-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup dotnet 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev libwebp-dev zlib1g-dev
          pip install Cython pillow
      - name: Download NebulaFD general_patches
        run: |
          mkdir -p tools/nebula
          cd tools/nebula
          wget -q https://github.com/AITYunivers/NebulaFD/releases/download/general_patches/Nebula.general_patches.zip -O nebula.zip
          unzip -o nebula.zip
          ls -R
      - name: Download fnaf4.exe from release if exists
        run: |
          if [ -f ./fnaf4.exe ]; then
            echo "fnaf4.exe already present"
          else
            echo "Downloading fnaf4.exe from GitHub Release..."
            curl -L -o fnaf4.exe \
              https://github.com/hipliteidk-glitch/fnaf4-decompiled/releases/download/fnaf4-input/fnaf4.exe \
              || echo "Could not download fnaf4.exe - skipping decompile"
          fi
      - name: Clone Chowdren-Enhanced
        run: |
          git clone https://github.com/SHARD28/Chowdren-Enhanced.git chowdren_enhanced || git clone https://github.com/matpow2/Chowdren.git Chowdren
      - name: Try decompile if exe exists
        run: |
          DLL=$(find tools/nebula -name "Nebula.CLI.dll" | head -n1)
          echo "Nebula.CLI.dll: $DLL"
          if [ -f ./fnaf4.exe ]; then
            echo "Decompiling FNAF4.exe..."
            dotnet "$DLL"/./fnaf4.exe -o ./decompiled -v || echo "Decompile failed, check logs"
          else
            echo "No fnaf4.exe found - skipping decompile. Upload placeholder."
            echo "No EXE found" > decompiled/README.txt
          fi
          ls -R decompiled || true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fnaf4-decompiled
          path: decompiled/
          if-no-files-found: warn