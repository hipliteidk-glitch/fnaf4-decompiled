name: decompile
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: download Nebula
        run: |
          set -e
          mkdir -p tools
          cd tools
          wget -q https://github.com/AITYunivers/NebulaFD/releases/download/general_patches/Nebula.general_patches.zip -O n.zip
          unzip -o n.zip
          ls -lh
          # fix libz for linux
          cp runtimes/linux-x64/native/libz.so ./libz.so || cp /usr/lib/x86_64-linux-gnu/libz.so.1 ./libz.so || true
          cp ./libz.so ./zlibwapi.dll || true
          cp ./libz.so ./libzlibwapi.so || true
          ls -lh *.dll *.so | head -n 50
      - name: decompile
        run: |
          set -e
          EXE="./fnaf4.exe"
          if [ ! -f "$EXE" ]; then EXE=$(find . -maxdepth 2 -name "*.exe" -type f | grep -i fnaf | head -n1); fi
          echo "EXE: $EXE"
          ls -lh "$EXE"
          DLL="tools/Nebula.dll"
          echo "PWD: $(pwd)"
          ls -lh tools/
          # Nebula is interactive - it asks for File Path via Spectre.Console
          # On CI there's no TTY so it crashes with NullReference at WaitForFile()
          # Fix: pipe the exe path into stdin, and also set TERM
          export TERM=xterm
          echo "Feeding $EXE to Nebula..."
          printf "%s\n" "$(realpath $EXE)" | dotnet "$DLL" || true
          # Alternative: try with --non-interactive if exists
          echo "Trying with args piped:"
          printf "%s\n\n" "$(realpath $EXE)" | dotnet "$DLL" 2>&1 | tail -n 200 || true
          # Check outputs - Nebula defaults to Nebula/Dumps/GameName or Dumps/
          echo "=== find dumps ==="
          find . -type d -name "Dumps" -o -name "dumps" | head -n 20
          find . -maxdepth 5 -type f | grep -i mfa | head -n 20 || true
          ls -R | head -n 1000
          # Also try direct non-interactive mode from newer forks: --input
          dotnet "$DLL" --help 2>&1 || true
          # If still no output, try running exe from tools dir with libz in LD_LIBRARY_PATH
          LD_LIBRARY_PATH="$PWD/tools:$LD_LIBRARY_PATH" printf "%s\n" "$(realpath $EXE)" | dotnet "$DLL" || true
          ls -R | tail -n 1000
