name: decompile
on:
  workflow_dispatch: null
  push:
    branches:
    - main
  release:
    types:
    - published
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: deps
      run: 'sudo apt-get update

        sudo apt-get install -y build-essential libwebp-dev zlib1g-dev unzip wget

        pip install Cython pillow'
    - name: download exe
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: 'gh release download fnaf4-input --repo ${{ github.repository }} --clobber
        || echo "no release yet"

        ls -lh'
    - name: download Nebula
      run: 'mkdir -p tools

        cd tools

        wget -q https://github.com/AITYunivers/NebulaFD/releases/download/general_patches/Nebula.general_patches.zip
        -O n.zip

        unzip -o n.zip

        ls -lh

        find runtimes -name "libz.so" | head -n 20

        if [ -f runtimes/linux-x64/native/libz.so ]; then cp runtimes/linux-x64/native/libz.so
        ./libz.so; elif [ -f runtimes/linux-arm64/native/libz.so ]; then cp runtimes/linux-arm64/native/libz.so
        ./libz.so; else cp /usr/lib/x86_64-linux-gnu/libz.so.1 ./libz.so; fi

        cp ./libz.so ./zlibwapi.dll

        cp ./libz.so ./libzlibwapi.so

        cp ./libz.so ./libz.so.1 || true

        ls -lh *.dll *.so 2>&1 | head -n 100'
    - name: decompile
      run: "set -e\nEXE=\"./fnaf4.exe\"\nif [ ! -f \"$EXE\" ]; then\n  EXE=$(find\
        \ . -maxdepth 2 -name \"*.exe\" -type f | grep -i fnaf | head -n1)\nfi\necho\
        \ \"EXE: $EXE\"\nls -lh \"$EXE\" || true\nDLL=\"tools/Nebula.dll\"\nif [ !\
        \ -f \"$DLL\" ]; then\n  DLL=$(find tools -name \"Nebula.dll\" | head -n1)\n\
        fi\necho \"Using DLL: $DLL\"\ncd tools\ndotnet \"$DLL\" --help || true\ndotnet\
        \ \"$DLL\" \"../$EXE\" -o ../decompiled -v || dotnet \"$DLL\" \"../$EXE\"\
        \ ../decompiled || dotnet \"$DLL\" \"../$EXE\"\ncd ..\nls -R decompiled |\
        \ head -n 1000\n"
    - name: upload
      uses: actions/upload-artifact@v4
      with:
        name: decompiled
        path: decompiled
