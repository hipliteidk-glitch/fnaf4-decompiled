name: decompile
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Install deps
      run: |
        sudo apt-get update -y
        sudo apt-get install -y libweb-dev zlib1g-dev unzip wget
    - name: Download FNAF4 exe
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e
        rm -f fnaf4.exe
        gh release download fnaf4-input --repo ${{ github.repository }} --clobber || echo \"no release\"
        ls -lh *.exe || exit 1
    - name: Download NebulaFD (fixed path)
      run: |
        rm -rf tools && mkdir -p tools
        cd tools
        wget -q https://github.com/AITYunivers/NebulaFD/releases/download/general_patches/Nebula.general_patches.zip -O n.zip
        unzip -o n.zip
        find . -name \"Nebula.CLI.dll\" | head -n1 > ../dll.txt
        cat ../dll.txt
    - name: Decompile
      run: |
        set -e
        DLDL=$(cat ../dll.txt)
        echo "DLL=$DDL"
        mkdir -p decompiled
        rm -rf decompiled/*
        dotnet "$DDL" "$(pwd)/fnaf4.exe" -o "$(pwd)/decompiled" -v
        ls -R decompiled | head -n 400
    - name: Upload artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: decompiled
        path: decompiled
        if-no-files-found: warn
