name: decompile
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: download exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release download fnaf4-input --repo ${{ github.repository }} --clobber; if (-not $?) { Write-Host "no release fnaf4-input" }
          Get-ChildItem -Recurse -Filter *.exe | Format-Table
      - name: download Nebula
        shell: pwsh
        run: |
          mkdir tools -Force
          cd tools
          Invoke-WebRequest -Uri https://github.com/AITYunivers/NebulaFD/releases/download/general_patches/Nebula.general_patches.zip -OutFile n.zip
          Expand-Archive -Path n.zip -DestinationPath . -Force
          Get-ChildItem
      - name: decompile
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter *.exe | Where-Object { $_.Name -like "*fnaf*" -or $_.Length -gt 10MB } | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem -Filter *.exe | Select-Object -First 1 }
          if (-not $exe) { Write-Error "NO EXE FOUND"; Get-ChildItem -Recurse | Out-Host; exit 1 }
          Write-Host "EXE: $($exe.FullName)"
          $dll = "tools/Nebula.dll"
          Write-Host "DLL: $dll"
          # Nebula interactive fix: pipe path
          $exeFull = $exe.FullName
          Write-Host "Feeding $exeFull to Nebula"
          $exeFull | dotnet $dll
          Write-Host "--- after first run ---"
          Get-ChildItem -Recurse -Depth 3 | Format-Table
          # Check Dumps
          if (Test-Path ./Dumps) { Get-ChildItem ./Dumps -Recurse | Format-Table }
          if (Test-Path ./tools/Dumps) { Get-ChildItem ./tools/Dumps -Recurse | Format-Table }
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decompiled
          path: |
            Dumps
            dumps
            tools/Dumps
            **/*.mfa
            **/*.log
            **/nebula*.log
