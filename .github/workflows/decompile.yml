name: decompile
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Install deps
      run: |
        sudo apt-get update -y
        sudo apt-get install -y libwebp-dev zlib1g-dev unzip wget gh
    - name: Download FNAF4 exe
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e
        rm -f fnaf4.exe
        gh release download fnaf4-input --repo ${{ github.repository }} --clobber || (echo \"no release\" && gh release list --repo ${{ github.repository }} || true)
        ls -lh *.exe || exit 1
    - name: Download NebulaFD
      run: |
        rm -rf tools && mkdir -p tools
        cd tools
        wget -q https://github.com/AITYunivers/NebulaFD/releases/download/general_patches/Nebula.general_patches.zip -O n.zip
        unzip -o n.zip
        find. -name "Nebula.CLI.dll" | head -n1 | tee../dll.txt
        cat../dll.txt
        ls -R | head -n 100
    - name: Decompile
      run: |
        set -e
        DLL=$(cat dll.txt)
        echo "DLL=$DDL"
        ls -lh "$DLL" || (echo "DLL not found"; find tools -name "*.dll" | head -n20; exit 1)
        mkdir -p decompiled
        rm -rf decompiled/*
        dotnet "$DLL" "$(pwd)/fnaf4.exe" -o "$(pwd)/decompiled" -v
        ls -R decompiled | head -n 500
    - name: Upload artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: decompiled
        path: decompiled
        if-no-files-found: warn